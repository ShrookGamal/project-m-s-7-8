<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تفاصيل المقال | مؤسسة سند</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D530E;
            --secondary: #306D29;
            --bg: #FBF5DD;
            --accent: #E7E1B1;
            --white: #ffffff;
            --text: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: 'Cairo', sans-serif;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .glass-nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .back-btn {
            text-decoration: none;
            color: var(--white);
            background: var(--primary);
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-text {
            font-weight: 900;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .article-hero {
            position: relative;
            width: 100%;
            height: 55vh;
            margin-top: 0;
            overflow: hidden;
        }

        .article-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(13, 83, 14, 0.8), transparent);
            display: flex;
            align-items: flex-end;
            padding: 40px 5%;
        }

        .hero-overlay h1 {
            color: var(--white);
            font-size: 2.8rem;
            font-weight: 900;
            max-width: 900px;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .content-wrapper {
            max-width: 1000px;
            margin: -60px auto 60px;
            position: relative;
            z-index: 10;
            padding: 0 20px;
        }

        .main-article-card {
            background: var(--white);
            border-radius: 40px;
            padding: 60px;
            box-shadow: 0 30px 60px rgba(13, 83, 14, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .article-body {
            font-size: 1.25rem;
            line-height: 2.2;
            color: #333;
        }

        .article-body p { margin-bottom: 25px; text-align: justify; }

        .article-body h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin: 40px 0 20px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .article-body h2::before {
            content: '';
            width: 10px;
            height: 30px;
            background: var(--secondary);
            border-radius: 5px;
        }

        .feature-box {
            background: var(--bg);
            padding: 30px;
            border-radius: 25px;
            border-right: 6px solid var(--primary);
            margin: 30px 0;
        }

        .cta-bottom {
            margin-top: 50px;
            text-align: center;
            padding: 40px;
            background: var(--primary);
            border-radius: 30px;
            color: var(--white);
        }

        .cta-bottom h3 { font-size: 1.5rem; margin-bottom: 20px; }

        .btn-call-large {
            display: inline-block;
            background: var(--accent);
            color: var(--primary);
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .hero-overlay h1 { font-size: 1.4rem; padding-bottom: 20px; }
            .article-hero { height: 40vh; }
            .main-article-card { padding: 30px 20px; border-radius: 30px; margin-top: -40px; }
            .article-body { font-size: 0.95rem; line-height: 1.8; }
            .article-body h2 { font-size: 1.2rem; margin: 30px 0 15px; }
            .article-body h2::before { height: 20px; width: 6px; }
            .feature-box { padding: 20px; font-size: 0.9rem; }
            .cta-bottom { padding: 25px 15px; }
            .cta-bottom h3 { font-size: 1.1rem; }
            .btn-call-large { padding: 12px 30px; font-size: 0.95rem; }
            .logo-text { font-size: 0.9rem; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-article-card { animation: fadeIn 0.8s ease-out; }
    </style>
</head>
<body>

    <nav class="glass-nav">
        <a href="index.html" class="back-btn"><span>➜</span> الرئيسية</a>
        <div class="logo-text">مؤسسة سند </div>
    </nav>

    <div class="article-hero">
        <img id="post-img" src="" alt="">
        <div class="hero-overlay">
            <h1 id="post-title"></h1>
        </div>
    </div>

    <main class="content-wrapper">
        <article class="main-article-card">
            <div class="article-body" id="post-content">
            </div>
            
            <div class="cta-bottom">
                <h3>هل تبحث عن تنفيذ احترافي لمنزلك؟</h3>
                <p style="margin-bottom: 20px; opacity: 0.9;">نحن في مؤسسة سند جاهزون لتحويل رؤيتك إلى واقع في الرياض والمدينة وتبوك.</p>
                <a href="tel:0563262230" class="btn-call-large">اتصل بنا الآن 0563262230</a>
            </div>
        </article>
    </main>

    <script>
        const posts = {
            1: {
                title: "دليل عزل الأسطح الشامل في المناطق الحارة (المدينة والرياض وتبوك)",
                img: "images/blog1.png",
                content: `
                    <p>في ظل الارتفاع المتزايد في درجات الحرارة داخل المملكة، أصبح <strong>عزل الأسطح</strong> ضرورة هندسية لا غنى عنها. نحن في مؤسسة سند نوفر تقنيات عزل تتجاوز مجرد الحماية، لتصل إلى الرفاهية الكاملة وتوفير الطاقة.</p>
                    
                    <div class="feature-box">
                        تساهم أنظمة العزل التي نقدمها في خفض فواتير الكهرباء بنسبة تصل إلى 45% من خلال تقليل الاعتماد على أجهزة التبريد.
                    </div>

                    <h2>لماذا تختار عزل مؤسسة سند؟</h2>
                    <p>نحن لا نستخدم مجرد مواد عزل، بل نقدم نظاماً متكاملاً من العزل المائي والحراري المعتمد. نستخدم "عزل الفوم" عالي الكثافة الذي يغلق كافة المسام ويمنع تسربات المياه نهائياً، مما يحافظ على حديد التسليح من الصدأ.</p>
                    
                    <h2>مميزات خدماتنا في الرياض وتبوك والمدينة:</h2>
                    <p>1. استخدام مواد أصلية ومضمونة من كبرى الشركات العالمية.<br>
                    2. فريق فني متخصص خاضع لأعلى معايير التدريب.<br>
                    3. ضمان يصل إلى 10 سنوات على كافة أعمال العزل.</p>
                `
            },
            2: {
                title: "اتجاهات الدهانات الحديثة والديكور لعام 2026",
                img: "images/blog2png.png",
                content: `
                    <p>الألوان ليست مجرد طلاء، بل هي انعكاس لشخصيتك داخل منزلك. مؤسسة سند تأخذك في رحلة لاختيار أرقى <strong>الدهانات والديكورات</strong> التي تواكب الموضة العالمية لعام 2024.</p>
                    
                    <h2>الألوان الترابية والهادئة</h2>
                    <p>تسيطر الألوان المستوحاة من الطبيعة على التصاميم لهذا العام. "البيج الكريمي" و "الأخضر المريمي" يمنحان إحساساً بالهدوء والسكينة، وهما مثاليان للمجالس وغرف النوم الواسعة.</p>

                    <div class="feature-box">
                        نستخدم حصرياً دهانات "جوتن" و "سيجما" التي تتميز بثبات اللون العالي وسهولة التنظيف لضمان بقاء جدرانك متألقة لسنوات.
                    </div>

                    <h2>خدماتنا في الدهانات الخارجية:</h2>
                    <p>نوفر دهانات واجهات مقاومة للأملاح والرطوبة وأشعة الشمس الفوق بنفسجية، مما يضمن عدم تغير لون الواجهة أو تقشرها مهما كانت الظروف المناخية في المدينة المنورة أو الرياض.</p>
                `
            },
            3: {
                title: "تصميم المطابخ وغرف النوم: فن استغلال المساحات",
                img: "images/blog3.png",
                content: `
                    <p>النجارة الفنية هي العمود الفقري لأي منزل فخم. في مؤسسة سند، نحول الخشب الصامت إلى <strong>ديكورات ومطابخ</strong> تنبض بالحياة والجمال، مع التركيز التام على استغلال كل سنتيمتر من المساحة.</p>
                    
                    <h2>المطابخ الحديثة (Smart Kitchens)</h2>
                    <p>نصمم مطابخنا بنظام "المثلث الذهبي" لضمان سلاسة الحركة بين الطبخ والتخزين والغسيل. نستخدم أخشاب الـ MDF المقاومة للماء والحريق، مع إكسسوارات إغلاق ناعمة تمنع الضوضاء وتحافظ على متانة الخزائن.</p>

                    <div class="feature-box">
                        كل قطعة أثاث أو مطبخ ننتجها تخضع لرقابة جودة صارمة، مع استخدام دهانات حرارية للأخشاب لا تتأثر بالزيوت أو الرطوبة.
                    </div>

                    <h2>غرف النوم والديكورات الخشبية:</h2>
                    <p>سواء كنت ترغب في "بديل الخشب" للجدران أو أسرة ملكية مصممة خصيصاً، فإن ورشنا المجهزة في المدينة والرياض وتبوك جاهزة للتنفيذ بدقة متناهية تضاهي الصناعات العالمية.</p>
                `
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const post = posts[postId];

        if (post) {
            document.getElementById('post-title').innerText = post.title;
            document.getElementById('post-img').src = post.img;
            document.getElementById('post-content').innerHTML = post.content;
            document.title = post.title + " | مؤسسة سند";
        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
